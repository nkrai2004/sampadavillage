<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaf — WhatsApp Lead CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F2ED;
    --panel:#FFFFFF;
    --ink:#20281F;
    --ink-soft:#5B665A;
    --line:#E4E1D6;
    --sidebar:#16211B;
    --sidebar-text:#E9EBE4;
    --sidebar-text-dim:#8FA093;
    --accent:#3E7C59;
    --accent-dark:#2C5C41;
    --amber:#C98A2A;
    --blue:#3A6EA5;
    --red:#B24A3D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  .brand{font-family:'Fraunces',serif;font-weight:600;}

  .app{display:flex;height:100vh;overflow:hidden;}

  /* Sidebar */
  .sidebar{width:320px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;}
  .sidebar-head{padding:20px 18px 12px;}
  .sidebar-head h1{font-size:20px;margin:0 0 2px;letter-spacing:.2px;}
  .sidebar-head p{margin:0;font-size:12px;color:var(--sidebar-text-dim);}
  .search-row{padding:0 18px 12px;}
  .search-row input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #2A362E;background:#1D2A22;color:var(--sidebar-text);font-size:13px;outline:none;}
  .search-row input::placeholder{color:var(--sidebar-text-dim);}
  .filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 14px;}
  .chip{font-size:11px;padding:5px 10px;border-radius:999px;background:#1D2A22;color:var(--sidebar-text-dim);cursor:pointer;border:1px solid transparent;user-select:none;}
  .chip.active{background:var(--accent);color:#fff;}
  .lead-list{flex:1;overflow-y:auto;padding:0 8px 12px;}
  .lead-item{padding:10px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;display:flex;flex-direction:column;gap:2px;}
  .lead-item:hover{background:#1D2A22;}
  .lead-item.selected{background:var(--accent-dark);}
  .lead-item .row1{display:flex;justify-content:space-between;align-items:center;}
  .lead-item .name{font-size:13.5px;font-weight:600;}
  .lead-item .phone{font-size:11.5px;color:var(--sidebar-text-dim);}
  .status-tag{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  .status-New{background:#4a3a1c;color:#E8B458;}
  .status-Contacted{background:#20344a;color:#7fb1e0;}
  .status-Qualified{background:#1c3a2c;color:#7fd8a6;}
  .status-Won{background:#173a24;color:#5fe08c;}
  .status-Lost{background:#3a201c;color:#e08a7f;}
  .add-lead-btn{margin:10px 18px 16px;padding:10px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;}
  .add-lead-btn:hover{background:var(--accent-dark);}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--panel);}
  .config-row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);}
  .config-row input{font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:340px;}
  .config-row button{font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .pill{font-size:11px;padding:4px 9px;border-radius:999px;background:#EDEAE0;color:var(--ink-soft);}
  .pill.ok{background:#E1F0E5;color:var(--accent-dark);}
  .pill.err{background:#F5E4E1;color:var(--red);}

  .content{flex:1;display:flex;overflow:hidden;}
  .empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:14px;flex-direction:column;gap:10px;}

  .detail{width:320px;flex-shrink:0;border-right:1px solid var(--line);padding:20px;overflow-y:auto;background:var(--panel);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field input, .field select, .field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:inherit;color:var(--ink);}
  .field textarea{min-height:80px;resize:vertical;}
  .meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .save-btn{width:100%;padding:9px;border-radius:7px;background:var(--accent);color:#fff;border:none;font-weight:600;font-size:13px;cursor:pointer;margin-top:6px;}
  .save-btn:hover{background:var(--accent-dark);}

  .chat-col{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-head{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel);}
  .chat-head .name{font-size:16px;font-weight:600;}
  .chat-head .phone{font-size:12px;color:var(--ink-soft);}
  .chat-thread{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:8px;background:#EFEDE4;}
  .bubble{max-width:60%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;}
  .bubble.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:2px;}
  .bubble.out{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:2px;}
  .bubble .ts{display:block;font-size:10px;margin-top:4px;opacity:.65;}
  .reply-row{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel);}
  .reply-row textarea{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13.5px;resize:none;min-height:42px;}
  .reply-row button{padding:0 18px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}
  .reply-row button:hover{background:var(--accent-dark);}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,25,20,.45);display:none;align-items:center;justify-content:center;z-index:20;}
  .modal-backdrop.show{display:flex;}
  .modal{background:#fff;border-radius:12px;padding:22px;width:360px;}
  .modal h2{margin:0 0 14px;font-size:17px;}
  .modal .field{margin-bottom:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .btn-secondary{padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;}
  .btn-primary{padding:8px 14px;border-radius:7px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:600;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1 class="brand">🌿 Leaf CRM</h1>
      <p>WhatsApp enquiries → leads</p>
    </div>
    <div class="search-row">
      <input id="searchInput" placeholder="Search name or phone…" />
    </div>
    <div class="filters" id="filterChips"></div>
    <div class="lead-list" id="leadList"></div>
    <button class="add-lead-btn" id="addLeadBtn">+ Add lead manually</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="config-row">
        <span>Apps Script URL:</span>
        <input id="apiUrlInput" placeholder="Paste your /exec Web App URL here" />
        <button id="connectBtn">Connect</button>
      </div>
      <span class="pill" id="statusPill">Not connected</span>
    </div>

    <div class="content" id="content">
      <div class="empty-state">
        <div>Paste your Apps Script Web App URL above and click Connect.</div>
        <div style="font-size:12px;">See the setup guide for how to get that URL.</div>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2>Add a lead manually</h2>
    <div class="field"><label>Name</label><input id="newName" /></div>
    <div class="field"><label>Phone (with country code)</label><input id="newPhone" placeholder="91XXXXXXXXXX" /></div>
    <div class="field"><label>Source</label><input id="newSource" placeholder="e.g. Website, Referral" /></div>
    <div class="field"><label>Notes</label><textarea id="newNotes"></textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelAddBtn">Cancel</button>
      <button class="btn-primary" id="submitAddBtn">Add lead</button>
    </div>
  </div>
</div>

<script>
/* ---------- Configuration ---------- */
// You can hardcode your Apps Script Web App URL here so you don't need
// to paste it in every time, e.g.:
// const CONFIG = { API_URL: "https://script.google.com/macros/s/XXXX/exec" };
const CONFIG = { API_URL: "" };

/* ---------- State ---------- */
let state = {
  apiUrl: CONFIG.API_URL,
  leads: [],
  messages: [],
  selectedLeadId: null,
  statusFilter: 'All',
  search: '',
  pollHandle: null
};

const STATUSES = ['New', 'Contacted', 'Qualified', 'Won', 'Lost'];

/* ---------- DOM refs ---------- */
const el = {
  apiUrlInput: document.getElementById('apiUrlInput'),
  connectBtn: document.getElementById('connectBtn'),
  statusPill: document.getElementById('statusPill'),
  searchInput: document.getElementById('searchInput'),
  filterChips: document.getElementById('filterChips'),
  leadList: document.getElementById('leadList'),
  content: document.getElementById('content'),
  addLeadBtn: document.getElementById('addLeadBtn'),
  modalBackdrop: document.getElementById('modalBackdrop'),
  cancelAddBtn: document.getElementById('cancelAddBtn'),
  submitAddBtn: document.getElementById('submitAddBtn'),
};

if (state.apiUrl) el.apiUrlInput.value = state.apiUrl;

/* ---------- API helpers ---------- */
async function apiGetData() {
  const res = await fetch(state.apiUrl + '?action=getData');
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

async function apiPost(payload) {
  const res = await fetch(state.apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

/* ---------- Data refresh ---------- */
async function refresh() {
  try {
    const data = await apiGetData();
    state.leads = data.leads || [];
    state.messages = data.messages || [];
    setStatus('ok', 'Connected · ' + state.leads.length + ' leads');
    renderLeadList();
    renderContent();
  } catch (err) {
    setStatus('err', 'Connection error');
    console.error(err);
  }
}

function setStatus(kind, text) {
  el.statusPill.className = 'pill ' + (kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : '');
  el.statusPill.textContent = text;
}

/* ---------- Rendering: filters ---------- */
function renderFilterChips() {
  const options = ['All'].concat(STATUSES);
  el.filterChips.innerHTML = options.map(function (s) {
    const active = state.statusFilter === s ? ' active' : '';
    return '<span class="chip' + active + '" data-status="' + s + '">' + s + '</span>';
  }).join('');
  Array.from(el.filterChips.children).forEach(function (chip) {
    chip.addEventListener('click', function () {
      state.statusFilter = chip.dataset.status;
      renderFilterChips();
      renderLeadList();
    });
  });
}
renderFilterChips();

/* ---------- Rendering: lead list ---------- */
function filteredLeads() {
  return state.leads.filter(function (l) {
    const matchesStatus = state.statusFilter === 'All' || l.Status === state.statusFilter;
    const term = state.search.toLowerCase();
    const matchesSearch = !term ||
      (l.Name || '').toLowerCase().includes(term) ||
      (l.Phone || '').toLowerCase().includes(term);
    return matchesStatus && matchesSearch;
  }).sort(function (a, b) {
    return new Date(b.LastMessageAt) - new Date(a.LastMessageAt);
  });
}

function renderLeadList() {
  const leads = filteredLeads();
  if (leads.length === 0) {
    el.leadList.innerHTML = '<div style="padding:16px;color:var(--sidebar-text-dim);font-size:12.5px;">No leads yet. New WhatsApp messages will appear here automatically.</div>';
    return;
  }
  el.leadList.innerHTML = leads.map(function (l) {
    const selected = String(l.LeadID) === String(state.selectedLeadId) ? ' selected' : '';
    return '<div class="lead-item' + selected + '" data-id="' + l.LeadID + '">' +
      '<div class="row1"><span class="name">' + escapeHtml(l.Name || l.Phone) + '</span>' +
      '<span class="status-tag status-' + l.Status + '">' + l.Status + '</span></div>' +
      '<span class="phone">' + escapeHtml(l.Phone) + '</span>' +
      '</div>';
  }).join('');
  Array.from(el.leadList.children).forEach(function (item) {
    item.addEventListener('click', function () {
      state.selectedLeadId = item.dataset.id;
      renderLeadList();
      renderContent();
    });
  });
}

/* ---------- Rendering: main content (detail + chat) ---------- */
function renderContent() {
  const lead = state.leads.find(function (l) { return String(l.LeadID) === String(state.selectedLeadId); });
  if (!lead) {
    el.content.innerHTML = '<div class="empty-state"><div>Select a lead on the left to view details and chat history.</div></div>';
    return;
  }

  el.content.innerHTML =
    '<div class="detail" id="detailPanel">' +
      field('Name', 'fName', lead.Name) +
      field('Phone', 'fPhone', lead.Phone) +
      selectField('Status', 'fStatus', lead.Status) +
      field('Source', 'fSource', lead.Source) +
      textareaField('Notes', 'fNotes', lead.Notes) +
      '<div class="meta">Created: ' + formatDate(lead.CreatedAt) + '</div>' +
      '<div class="meta">Last message: ' + formatDate(lead.LastMessageAt) + '</div>' +
      '<button class="save-btn" id="saveLeadBtn">Save changes</button>' +
    '</div>' +
    '<div class="chat-col">' +
      '<div class="chat-head"><div class="name">' + escapeHtml(lead.Name || lead.Phone) + '</div><div class="phone">' + escapeHtml(lead.Phone) + '</div></div>' +
      '<div class="chat-thread" id="chatThread">' + renderMessages(lead.LeadID) + '</div>' +
      '<div class="reply-row">' +
        '<textarea id="replyText" placeholder="Type a WhatsApp reply…"></textarea>' +
        '<button id="sendReplyBtn">Send</button>' +
      '</div>' +
    '</div>';

  document.getElementById('saveLeadBtn').addEventListener('click', function () { saveLead(lead.LeadID); });
  document.getElementById('sendReplyBtn').addEventListener('click', function () { sendReply(lead.LeadID, lead.Phone); });

  const thread = document.getElementById('chatThread');
  thread.scrollTop = thread.scrollHeight;
}

function field(label, id, value) {
  return '<div class="field"><label>' + label + '</label><input id="' + id + '" value="' + escapeAttr(value) + '" /></div>';
}
function textareaField(label, id, value) {
  return '<div class="field"><label>' + label + '</label><textarea id="' + id + '">' + escapeHtml(value || '') + '</textarea></div>';
}
function selectField(label, id, current) {
  const opts = STATUSES.map(function (s) {
    return '<option value="' + s + '"' + (s === current ? ' selected' : '') + '>' + s + '</option>';
  }).join('');
  return '<div class="field"><label>' + label + '</label><select id="' + id + '">' + opts + '</select></div>';
}

function renderMessages(leadId) {
  const msgs = state.messages
    .filter(function (m) { return String(m.LeadID) === String(leadId); })
    .sort(function (a, b) { return new Date(a.Timestamp) - new Date(b.Timestamp); });
  if (msgs.length === 0) return '<div style="color:var(--ink-soft);font-size:13px;">No messages yet.</div>';
  return msgs.map(function (m) {
    return '<div class="bubble ' + m.Direction + '">' + escapeHtml(m.Text) + '<span class="ts">' + formatDate(m.Timestamp) + '</span></div>';
  }).join('');
}

/* ---------- Actions ---------- */
async function saveLead(leadId) {
  const payload = {
    action: 'updateLead',
    leadId: leadId,
    Name: document.getElementById('fName').value,
    Phone: document.getElementById('fPhone').value,
    Status: document.getElementById('fStatus').value,
    Source: document.getElementById('fSource').value,
    Notes: document.getElementById('fNotes').value
  };
  await apiPost(payload);
  await refresh();
}

async function sendReply(leadId, phone) {
  const text = document.getElementById('replyText').value.trim();
  if (!text) return;
  document.getElementById('replyText').value = '';
  const result = await apiPost({ action: 'sendMessage', leadId: leadId, phone: phone, text: text });
  if (result && result.error) {
    alert('Could not send: ' + result.error);
  }
  await refresh();
}

/* ---------- Add lead modal ---------- */
el.addLeadBtn.addEventListener('click', function () { el.modalBackdrop.classList.add('show'); });
el.cancelAddBtn.addEventListener('click', function () { el.modalBackdrop.classList.remove('show'); });
el.submitAddBtn.addEventListener('click', async function () {
  const payload = {
    action: 'addLead',
    name: document.getElementById('newName').value,
    phone: document.getElementById('newPhone').value,
    source: document.getElementById('newSource').value,
    notes: document.getElementById('newNotes').value
  };
  await apiPost(payload);
  el.modalBackdrop.classList.remove('show');
  ['newName', 'newPhone', 'newSource', 'newNotes'].forEach(function (id) { document.getElementById(id).value = ''; });
  await refresh();
});

/* ---------- Search + connect ---------- */
el.searchInput.addEventListener('input', function () {
  state.search = el.searchInput.value;
  renderLeadList();
});

el.connectBtn.addEventListener('click', function () {
  state.apiUrl = el.apiUrlInput.value.trim();
  if (!state.apiUrl) { setStatus('err', 'Enter a URL first'); return; }
  if (state.pollHandle) clearInterval(state.pollHandle);
  refresh();
  state.pollHandle = setInterval(refresh, 15000);
});

/* ---------- Utils ---------- */
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function escapeAttr(str) { return escapeHtml(str); }
function formatDate(d) {
  if (!d) return '—';
  const date = new Date(d);
  if (isNaN(date.getTime())) return String(d);
  return date.toLocaleString();
}

/* ---------- Boot ---------- */
if (state.apiUrl) {
  refresh();
  state.pollHandle = setInterval(refresh, 15000);
}
</script>
</body>
</html>
